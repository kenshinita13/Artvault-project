name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 15 minutes to prevent the Supabase Free Tier project from sleeping
    - cron: '*/15 * * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping to Supabase
        run: |
          echo "Pinging Supabase to keep it awake..."
          curl -I -s "https://exaaahqhnesijbdixjzc.supabase.co/rest/v1/"
          echo "Ping complete!"
